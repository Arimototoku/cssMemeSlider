<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meme Slider</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <input type="radio" name="slider-control" id="slide-1" checked />
      <input type="radio" name="slider-control" id="slide-2" />
      <input type="radio" name="slider-control" id="slide-3" />
      <input type="radio" name="slider-control" id="slide-4" />
      <div class="slider-container">
        <div class="slider">
          <div class="slide"><img src="images/mem1.jpg" alt="mem1" /></div>
          <div class="slide"><img src="images/mem2.jpg" alt="mem2" /></div>
          <div class="slide"><img src="images/mem3.jpg" alt="mem3" /></div>
          <div class="slide"><img src="images/mem4.jpg" alt="mem4" /></div>
        </div>
      </div>
      <div class="text_control">
        <div class="slider-text">
          <p class="text-item">Fifth year of war</p>
          <p class="text-item">
            "You know, I'm something of a frontend developer myself."
          </p>
          <p class="text-item">I'm not crying</p>
          <p class="text-item">Thanks for watching</p>
        </div>
        <div class="pagination">
          <label for="slide-1"><span></span></label>
          <label for="slide-2"><span></span></label>
          <label for="slide-3"><span></span></label>
          <label for="slide-4"><span></span></label>
        </div>
      </div>
    </main>
  </body>
</html>
