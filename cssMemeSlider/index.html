<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="slider-container">
      <input type="radio" name="slider-control" id="slide-1" checked />
      <input type="radio" name="slider-control" id="slide-2" />
      <input type="radio" name="slider-control" id="slide-3" />
      <input type="radio" name="slider-control" id="slide-4" />
      <div class="slider">
        <div class="slide">Slide 1</div>
        <div class="slide">Slide 2</div>
        <div class="slide">Slide 3</div>
        <div class="slide">Slide 4</div>
      </div>
      <div class="pagination">
        <label for="slide-1"></label>
        <label for="slide-2"></label>
        <label for="slide-3"></label>
        <label for="slide-4"></label>
      </div>
    </div>
  </body>
</html>
